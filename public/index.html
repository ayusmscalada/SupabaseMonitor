<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supabase Monitor</title>
<style>
  :root {
    --bg: #f7f8fa;
    --surface: #ffffff;
    --border: #e5e7eb;
    --text: #111827;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-soft: #eff4ff;
    --danger: #b91c1c;
    --danger-soft: #fef2f2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; }

  button {
    font: inherit; cursor: pointer;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 14px;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { background: #1d4ed8; color: #fff; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .tile .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .tile .value { font-size: 26px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tile .value.small { font-size: 16px; line-height: 39px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .toolbar strong { font-weight: 600; }
  input[type=search] {
    font: inherit; width: 280px; max-width: 100%;
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; background: var(--surface); color: var(--text);
  }
  input[type=search]:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th {
    background: #fafbfc; color: var(--muted); font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .04em; cursor: pointer; user-select: none;
  }
  th:hover { color: var(--text); }
  th .arrow { color: var(--accent); margin-left: 4px; }
  tbody tr:hover { background: var(--accent-soft); }
  tbody tr:last-child td { border-bottom: 0; }
  td.num { font-variant-numeric: tabular-nums; color: var(--muted); }
  td.empty { color: #c0c4cc; }
  td a { color: var(--accent); text-decoration: none; }
  td a:hover { text-decoration: underline; }
  .state { padding: 40px 16px; text-align: center; color: var(--muted); }

  .pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; }
  .pager .controls { display: flex; align-items: center; gap: 8px; }

  .error { background: var(--danger-soft); color: var(--danger); border: 1px solid #fecaca; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Supabase Monitor</h1>
      <div class="sub">Table <strong>gmail_contacts</strong> · <span id="updated">loading…</span></div>
    </div>
    <button id="refresh" class="primary">Refresh</button>
  </header>

  <div id="error" class="error" hidden></div>

  <section class="tiles">
    <div class="tile"><div class="label">Total contacts</div><div class="value" id="statTotal">–</div></div>
    <div class="tile"><div class="label">Unique emails</div><div class="value" id="statUnique">–</div></div>
    <div class="tile"><div class="label">With location</div><div class="value" id="statLocation">–</div></div>
    <div class="tile"><div class="label">Latest extraction</div><div class="value small" id="statLatest">–</div></div>
  </section>

  <section class="card">
    <div class="toolbar">
      <strong>Contacts</strong>
      <input id="search" type="search" placeholder="Search all columns…" autocomplete="off">
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr id="head"></tr></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
    <div id="state" class="state">Loading…</div>
    <div class="pager">
      <span id="range"></span>
      <div class="controls">
        <button id="prev">Previous</button>
        <span id="page"></span>
        <button id="next">Next</button>
      </div>
    </div>
  </section>
</div>

<script>
const PAGE_SIZE = 25;
const LABELS = { id: 'ID', email: 'Email', location: 'Location', source_url: 'Source URL', extracted_at: 'Extracted at', platform: 'Platform', Author_IP: 'Author IP' };

let rows = [];
let columns = [];
let sortKey = 'id';
let sortDir = 1;
let page = 1;
let query = '';

const $ = (id) => document.getElementById(id);
const isBlank = (v) => v === null || v === undefined || v === '';
const fmtDate = (v) => new Date(v).toLocaleString();

function filtered() {
  const q = query.trim().toLowerCase();
  const list = q
    ? rows.filter((r) => columns.some((c) => String(r[c] ?? '').toLowerCase().includes(q)))
    : rows.slice();
  return list.sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    if (isBlank(x) && isBlank(y)) return 0;
    if (isBlank(x)) return 1; // blanks always last
    if (isBlank(y)) return -1;
    if (typeof x === 'number' && typeof y === 'number') return (x - y) * sortDir;
    return String(x).localeCompare(String(y)) * sortDir;
  });
}

function cell(col, value) {
  const td = document.createElement('td');
  if (isBlank(value)) {
    td.textContent = '—';
    td.className = 'empty';
  } else if (col === 'extracted_at') {
    td.textContent = fmtDate(value);
  } else if (col === 'source_url' && /^https?:\/\//i.test(value)) {
    const a = document.createElement('a');
    a.href = value;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = value;
    td.appendChild(a);
  } else {
    td.textContent = value;
    if (col === 'id') td.className = 'num';
  }
  return td;
}

function renderStats() {
  $('statTotal').textContent = rows.length.toLocaleString();
  $('statUnique').textContent = new Set(rows.map((r) => String(r.email ?? '').toLowerCase()).filter(Boolean)).size.toLocaleString();
  $('statLocation').textContent = rows.filter((r) => !isBlank(r.location)).length.toLocaleString();
  const latest = rows.map((r) => r.extracted_at).filter(Boolean).sort().pop();
  $('statLatest').textContent = latest ? fmtDate(latest) : '–';
}

function renderHead() {
  const head = $('head');
  head.replaceChildren();
  for (const col of columns) {
    const th = document.createElement('th');
    th.textContent = LABELS[col] || col;
    if (col === sortKey) {
      const arrow = document.createElement('span');
      arrow.className = 'arrow';
      arrow.textContent = sortDir === 1 ? '▲' : '▼';
      th.appendChild(arrow);
    }
    th.addEventListener('click', () => {
      sortDir = col === sortKey ? -sortDir : 1;
      sortKey = col;
      page = 1;
      renderTable();
    });
    head.appendChild(th);
  }
}

function renderTable() {
  renderHead();
  const list = filtered();
  const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  page = Math.min(page, pages);
  const start = (page - 1) * PAGE_SIZE;
  const slice = list.slice(start, start + PAGE_SIZE);

  const body = $('body');
  body.replaceChildren();
  for (const row of slice) {
    const tr = document.createElement('tr');
    for (const col of columns) tr.appendChild(cell(col, row[col]));
    body.appendChild(tr);
  }

  $('state').hidden = list.length > 0;
  $('state').textContent = rows.length ? 'No contacts match your search.' : 'The table is empty.';
  $('range').textContent = list.length
    ? `Showing ${start + 1}–${start + slice.length} of ${list.length.toLocaleString()}`
    : '';
  $('page').textContent = `Page ${page} of ${pages}`;
  $('prev').disabled = page <= 1;
  $('next').disabled = page >= pages;
}

async function load() {
  const btn = $('refresh');
  btn.disabled = true;
  btn.textContent = 'Loading…';
  $('error').hidden = true;
  try {
    const res = await fetch('/api/contacts');
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
    rows = data.rows;
    columns = rows.length ? Object.keys(rows[0]) : Object.keys(LABELS);
    if (!columns.includes(sortKey)) sortKey = columns[0];
    $('updated').textContent = `updated ${fmtDate(data.fetchedAt)}`;
    renderStats();
    renderTable();
  } catch (err) {
    $('error').textContent = `Could not load data: ${err.message}`;
    $('error').hidden = false;
    $('state').textContent = 'No data loaded.';
    $('state').hidden = rows.length > 0;
    $('updated').textContent = 'load failed';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Refresh';
  }
}

$('refresh').addEventListener('click', load);
$('search').addEventListener('input', (e) => { query = e.target.value; page = 1; renderTable(); });
$('prev').addEventListener('click', () => { page--; renderTable(); });
$('next').addEventListener('click', () => { page++; renderTable(); });

load();
</script>
</body>
</html>
